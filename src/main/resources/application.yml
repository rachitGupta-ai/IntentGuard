spring:
  application:
    name: intentguard

server:
  port: 8080

intentguard:
  # Reference-monitor identity (Req 1.1, 1.2): the Enforcement_Engine runs under a dedicated
  # service account distinct from any monitored user.
  service-account: intentguard

  # Shell_Hook synchronous blocking gate. The Unix domain socket is owned by the service
  # account; monitored users may write requests but cannot alter engine state through it.
  socket:
    path: /var/run/intentguard/intentguard.sock

  # MongoDB Datastore connection (Behavioral_Profiles, Intent_Sessions, Audit_History, config).
  mongo:
    connection-string: mongodb://localhost:27017
    database: intentguard

  # ---- LLM Provider Selection -------------------------------------------------------
  # Set to "ollama" to use the Ollama/BT-server backend, or "gemini" for Google Gemini SDK.
  # When "ollama" is set, the intentguard.ollama.* config below is used for scoring,
  # explanations, translation, and NL command generation.
  llm:
    provider: ollama
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    timeout-ms: 1200

  # ---- Ollama / BT SRE LLM Server ---------------------------------------------------
  # Ollama-compatible REST API. Used when intentguard.llm.provider=ollama.
  # Supports local Ollama (http://localhost:11434) or BT SRE LLM service.
  ollama:
    base-url: https://asksredigital.bt.com/sre-llm-service-dev
    model: Qwen2.5:14B
    translation-model: Qwen2.5:14B
    api-key: ${OLLAMA_API_KEY:}
    # timeout-ms: non-blocking paths (translation, NL command generation). Generous.
    timeout-ms: 60000
    # scoring-timeout-ms: synchronous shell-hook scoring path. Kept tight so a slow/loaded
    # LLM server causes the Semantic_Inconsistency component to be EXCLUDED and the 3
    # deterministic components still score & block — the graceful-degradation guarantee.
    # When the server is fast (0.5-6s), the full semantic score is captured within this budget.
    scoring-timeout-ms: 8000

  # Indian-language text translation.
  # Set provider to "ollama" when using Ollama backend, or "gemini" for Gemini SDK.
  translation:
    provider: ollama
    api-key: ${TRANSLATION_API_KEY:${GEMINI_API_KEY:}}
    timeout-ms: 180000
    sensitive-content-translatable: false

  # Speech-to-text / text-to-speech via Gemini multimodal API.
  speech:
    provider: gemini
    api-key: ${SPEECH_API_KEY:${GEMINI_API_KEY:}}
    stt-timeout-ms: 10000
    tts-timeout-ms: 5000

  # Decision budget and timing bounds (see Threshold_Configuration in the design).
  decision:
    # Covers up to two scoring-path LLM calls (semantic + explanation) at scoring-timeout-ms each,
    # plus overhead, so a slow LLM degrades gracefully instead of hanging the shell.
    budget-ms: 20000
    monitoring-gap-timeout-ms: 5000
    confirmation-timeout-ms: 15000
    correlation-window-ms: 1000
    learning-min-events: 200

  # NL Operations Assistant — natural-language to scored shell commands. Generates 2-3
  # safe alternatives per query, scores them through the full safety pipeline, and executes
  # only after explicit operator confirmation. Sessions auto-close after idle timeout.
  assist:
    session-timeout-ms: 300000       # 5 minutes idle timeout before session auto-close
    rate-limit-per-minute: 10        # per-operator NL_Query submissions per minute
    execution-timeout-ms: 30000      # 30 seconds max for command execution via ProcessBuilder
    blocklist:                       # regex patterns unconditionally blocked from generation
      - "rm\\s+-rf\\s+/(?:\\s|$)"
      - "mkfs"
      - "rmmod"
      - "modprobe\\s+-r"

logging:
  level:
    com.intentguard: INFO
